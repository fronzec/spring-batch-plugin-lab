# Task reference usage https://taskfile.dev/usage/
---
version: '3'
silent: true
tasks:
  hello:
    cmds:
      - echo "Task works ok!!!"
  runmocks:
    cmds:
      - PYTHONPATH=./_devenvironment/mocks/ mockintosh ./_devenvironment/mocks/mocks.yaml
  runmocksquiet:
    cmds:
      - PYTHONPATH=./_devenvironment/mocks/ mockintosh --quiet ./_devenvironment/mocks/mocks.yaml
  dbbootstraping:
    cmds:
      - task: dbschema
      - task: dbdata
      - echo "db bootstraping finished"
  dbschema:
    cmds:
      - mysql -p frbatchservicedb < {{.TASKFILE_DIR}}/_devenvironment/db/00_create_schema.sql
  dbdata:
    cmds:
      - mysql -p frbatchservicedb < {{.TASKFILE_DIR}}/_devenvironment/db/01_init_data.sql
  prettier:
    cmds:
      # this is a basic config for prettier for java, see pom.xml for prettier-maven-plugin
      # https://github.com/jhipster/prettier-java
      - prettier --write "**/*.java"
  runapp:
    cmds:
      - infisical run --env=dev -- ./mvnw spring-boot:run -Dspring-boot.run.jvmArguments="-Dspring.profiles.active=dev"

  autoskills:
    cmds:
      - npx autoskills
